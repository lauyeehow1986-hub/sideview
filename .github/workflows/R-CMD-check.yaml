# R CMD check --as-cran on the platforms CRAN uses: Linux (R-devel, release,
# oldrel), macOS and Windows. NOT_CRAN is false so the run sees what CRAN sees
# (browser and Node.js tests skip, as they do there).
name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: false
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

  # Real-browser accessibility tests: the AX tree, the keyboard and axe-core (WCAG 2.2 A/AA).
  # NOT_CRAN is true here, so the browser tests run; axe-core is pinned.
  a11y:
    runs-on: ubuntu-latest
    name: a11y (browser, axe-core)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      SV_AXE_PATH: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::chromote, any::shinytest2, any::duckdb, any::arrow

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: browser-actions/setup-chrome@v1

      - name: Install axe-core
        run: npm install --no-save axe-core@4.10.3

      # Test files that do not exist yet (a PR in the series adds test-say.R) are skipped,
      # not failed; each existing file runs on its own and any failure stops the job.
      - name: Run accessibility tests
        run: |
          Rscript -e 'for (f in c("a11y-browser", "say")) if (file.exists(file.path("tests/testthat", paste0("test-", f, ".R")))) devtools::test(filter = f, stop_on_failure = TRUE) else message("no test file for filter: ", f)'
