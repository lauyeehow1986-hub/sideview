url: https://lauyeehow1986-hub.github.io/sideview/
template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#0284c7"
    secondary: "#64748b"
    success: "#10b981"
    info: "#06b6d4"
    bg: "#ffffff"
    fg: "#0f172a"

home:
  title: "sideview: Multi-Table 2D Infinite Canvas for R"
  description: "Explore multiple tables simultaneously on an infinite 2D canvas with mouse-wheel zoom, visual field mapping, and LLM-assisted tidyverse code generation."

authors:
  Yee How Lau:
    href: https://github.com/lauyeehow1986-hub
    html: <img src="https://avatars.githubusercontent.com/u/249935955?v=4" width="72px" style="border-radius:50%;margin-bottom:8px;" alt="Yee How Lau" />

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/lauyeehow1986-hub/sideview
      aria-label: GitHub repository

reference:
  - title: "Interactive Canvas & Gadget"
    desc: "Launch the interactive side-by-side multi-table canvas in RStudio or standalone."
    contents:
      - sideview
      - sideview_addin
      - sideview_ui
      - sideview_server
      - sv_find_tables

  - title: "Standalone HTMLWidget & Export"
    desc: "Export interactive canvases to self-contained, portable HTML reports or embed in Shiny."
    contents:
      - sideview_widget
      - save_sideview
      - sideviewOutput
      - renderSideview

  - title: "Tidyverse Code Generation Engine"
    desc: "Generate reproducible dplyr, tidyr, and forcats pipelines from visual canvas interactions."
    contents:
      - sv_code_join
      - sv_code_pivot_longer
      - sv_code_pivot_wider
      - sv_code_group_summarize
      - sv_code_rename
      - sv_code_mutate
      - sv_code_filter
      - sv_code_arrange
      - sv_code_select
      - sv_escape_ident

  - title: "Join Checks, Discrepancies & Recoding"
    desc: "Check join keys, detect fuzzy string mismatches, and generate case_when, fct_recode, or auto-cleanup rules."
    contents:
      - sv_detect_discrepancies
      - sv_join_diagnostics
      - sv_code_recode
      - sv_auto_clean_rules

  - title: "Column Profiles & Codebook"
    desc: "Profile a column (missingness, distinct values, quartiles, common values, data-quality flags) and export a data dictionary."
    contents:
      - sv_column_profile
      - sv_codebook

  - title: "Canvas State Persistence & Cloud Sharing"
    desc: "Serialize complete canvas topologies, card positions, splines, and pipelines to JSON or RDS."
    contents:
      - new_sideview_state
      - sv_save_state
      - sv_load_state
      - print.sideview_state

  - title: "Intelligent Copilot & Auto-Mapping"
    desc: "Proactively suggest candidate joins and orchestrate multi-turn AI assistance with context retention."
    contents:
      - sv_suggest_mappings
      - sv_build_chat_prompt
      - sv_build_schema_context
      - sv_build_prompt
      - sv_call_llm
      - sv_extract_code

  - title: "RStudio API & Environment Bridge"
    desc: "Direct 1-click insertion into active RStudio script editor buffers and console execution."
    contents:
      - sv_is_rstudio_available
      - sv_insert_code
      - sv_send_to_console

  - title: "Universal S3 Normalization"
    desc: "Convert heterogeneous tabular objects into standardized sideview cards."
    contents:
      - sv_normalize
